version: 2
builds:
  - id: "kcp-cache-syncagent"
    main: ./cmd/kcp-cache-syncagent
    binary: kcp-cache-syncagent
    ldflags:
      - "{{ .Env.LDFLAGS }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: kcp-cache-syncagent
    ids:
      - kcp-cache-syncagent

release:
  draft: true
  mode: keep-existing
